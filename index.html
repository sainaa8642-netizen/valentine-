<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{
margin:0;
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ffd6e7,#ffeef6);
font-family:Arial, sans-serif;
display:flex;
justify-content:center;
align-items:center;
}

.container{
background:white;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
width:90%;
max-width:400px;
position:relative;
z-index:2;
}

h1{
font-size:26px;
margin-bottom:20px;
}

button{
padding:12px 22px;
border:none;
border-radius:25px;
font-size:18px;
cursor:pointer;
margin:10px;
}

.yes-btn{
background:#ff4d6d;
color:white;
transition:0.2s;
}

.no-btn{
background:#ddd;
}

#message{
margin-top:15px;
font-size:14px;
color:#444;
}

/* Floating Hearts */
.heart{
position:absolute;
bottom:-20px;
font-size:20px;
animation:floatUp 6s linear infinite;
color:#ff4d6d;
}

@keyframes floatUp{
0%{transform:translateY(0);opacity:1;}
100%{transform:translateY(-110vh);opacity:0;}
}
</style>
</head>

<body>

<div class="container">
<h1 id="title">Adi my baby will you be my Valentine? 💖</h1>

<button class="yes-btn" id="yesBtn" onclick="yesClick()">Yes</button>
<button class="no-btn" onclick="noClick()">No</button>

<p id="message"></p>
</div>

<script>
/* Floating hearts generator */
setInterval(()=>{
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(Math.random()*20+15)+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),6000);
},300);

/* No button messages */
const messages=[
"Are you sure?",
"Really sure?",
"Think again!",
"Baby pleaseee 🥺",
"I’ll cry 😭",
"I’ll be very sad",
"Say yes already ❤️"
];

let msgIndex=0;
let size=18;

function noClick(){
document.getElementById("message").innerText=messages[msgIndex];
msgIndex=(msgIndex+1)%messages.length;

size+=5;
document.getElementById("yesBtn").style.fontSize=size+"px";
}

/* Yes click */
function yesClick(){
confetti({
particleCount:200,
spread:100,
origin:{y:0.6}
});

document.body.innerHTML=`
<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#ffeef6;text-align:center;">
<div>
<h1>YAYYYY 😍💘</h1>
<p>You’re my Valentine forever.</p>
<p>I love you ❤️</p>
</div>
</div>`;
}
</script>

</body>
</html>
