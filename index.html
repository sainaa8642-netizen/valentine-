<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{
margin:0;
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ffd6e7,#ffeef6);
font-family: 'Arial', sans-serif;
display:flex;
justify-content:center;
align-items:center;
}

.container{
background:white;
padding:25px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.25);
width:90%;
max-width:420px;
z-index:2;
}

h1{
font-size:26px;
margin-bottom:10px;
}

button{
padding:14px 24px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
margin:10px;
}

.yes-btn{
background:#ff4d6d;
color:white;
transition:0.2s;
}

.no-btn{
background:#ddd;
}

#message{
font-size:14px;
min-height:20px;
}

/* Floating hearts */
.heart{
position:absolute;
bottom:-20px;
font-size:20px;
animation:floatUp 6s linear infinite;
color:#ff4d6d;
}

@keyframes floatUp{
0%{transform:translateY(0);opacity:1;}
100%{transform:translateY(-120vh);opacity:0;}
}
</style>
</head>

<body>

<div class="container">

<h1>Adi my baby will you be my Valentine? 💖</h1>

<img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" width="160">
<img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" width="160">

<br>

<button class="yes-btn" id="yesBtn" onclick="yesClick()">Yes</button>
<button class="no-btn" onclick="noClick()">No</button>

<p id="message"></p>

</div>
