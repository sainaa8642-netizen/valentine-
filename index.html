<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
background: linear-gradient(135deg,#ffd6e7,#ffeef6);
font-family: Arial, sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:white;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
width:90%;
max-width:400px;
}

h1{
font-size:26px;
}

button{
padding:12px 20px;
border:none;
border-radius:20px;
font-size:18px;
cursor:pointer;
margin:10px;
}

.yes-button{
background:#ff4d6d;
color:white;
}

.no-button{
background:#ddd;
}

.hidden{
display:none;
}
</style>
</head>

<body>

<div class="container">
<h1 id="titleText">Adi my baby will you be my Valentine? 💖</h1>

<button class="yes-button" onclick="handleYes()">Yes</button>
<button class="no-button" onclick="handleNo()" id="noBtn">No</button>

<p id="message"></p>
</div>

<audio autoplay loop>
<source src="https://www.bensound.com/bensound-music/bensound-love.mp3">
</audio>

<script>
const messages = [
"Are you sure?",
"Really sure?",
"Think again!",
"Baby please...",
"I’ll cry 😭",
"I’ll be very sad...",
"Last chance...",
"Ok fine say yes ❤️"
];

let index = 0;
let size = 18;

function handleNo(){
document.getElementById("message").innerText = messages[index];
index = (index+1)%messages.length;

size += 5;
document.querySelector(".yes-button").style.fontSize = size + "px";
}

function handleYes(){
document.body.innerHTML = `
<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#ffeef6;text-align:center;">
<div>
<h1>YAYYY 😍💘</h1>
<p>You just made me the happiest person alive.</p>
<p>Happy Valentine’s Day my love ❤️</p>
</div>
</div>`;
}
</script>

</body>
</html>
